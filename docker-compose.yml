services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bankify
      POSTGRES_USER: bankify
      POSTGRES_PASSWORD: bankify
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: bankify
      RABBITMQ_DEFAULT_PASS: bankify
    ports:
      - "15672:15672"   # optional: management UI (can remove if prof doesn't need)

  bankify:
    build: .
    restart: always
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev

      # DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankify
      SPRING_DATASOURCE_USERNAME: bankify
      SPRING_DATASOURCE_PASSWORD: bankify

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: bankify
      RABBITMQ_PASSWORD: bankify

      # REQUIRED secrets for prod
      SECURITY_API_KEY_PEPPER: "CHANGE_ME_LONG_RANDOM"
      SECURITY_JWT_SECRET: "CHANGE_ME_LONG_RANDOM_JWT_SECRET"

      # optional bootstrap (ONLY set when you want to create first admin)
      # BANKIFY_BOOTSTRAP_TOKEN: "one-time-token"

volumes:
  postgres_data: