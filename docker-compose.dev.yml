services:

  postgres:

    image: postgres:17

    environment:

      POSTGRES_DB: bankify

      POSTGRES_USER: bankify

      POSTGRES_PASSWORD: bankify

    ports:

      - "5434:5432"

    volumes:

      - postgres_dev:/var/lib/postgresql/data
 
  redis:

    image: redis:7

    ports:

      - "6379:6379"
 
  rabbitmq:

    image: rabbitmq:3-management

    environment:

      RABBITMQ_DEFAULT_USER: bankify

      RABBITMQ_DEFAULT_PASS: bankify

    ports:

      - "5672:5672"

      - "15672:15672"
 
  bankify:

    build: .

    depends_on:

      - postgres

      - redis

      - rabbitmq

    ports:

      - "8080:8080"

    environment:

      SPRING_PROFILES_ACTIVE: dev
 
      # IMPORTANT: inside docker, use service names

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankify

      SPRING_DATASOURCE_USERNAME: bankify

      SPRING_DATASOURCE_PASSWORD: bankify
 
      SPRING_DATA_REDIS_HOST: redis

      SPRING_DATA_REDIS_PORT: 6379
 
      SPRING_RABBITMQ_HOST: rabbitmq

      SPRING_RABBITMQ_PORT: 5672

      SPRING_RABBITMQ_USERNAME: bankify

      SPRING_RABBITMQ_PASSWORD: bankify
 
      # 🔥 required secrets

      BANKIFY_BOOTSTRAP_TOKEN: testtoken

      SECURITY_API_KEY_PEPPER: dev-pepper

      SECURITY_JWT_SECRET: DEV_JWT_SECRET_MUST_BE_AT_LEAST_32_CHARS_LONG_123456789
 
volumes:

  postgres_dev:
 